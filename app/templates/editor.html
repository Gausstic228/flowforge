{% extends "base.html" %}
{% block title %}{{ project.name }} — FlowForge{% endblock %}
{% block body_class %}is-fullscreen-editor{% endblock %}

{% block content %}
<div class="editor-shell">

  <!-- ---------- Дерево проекта: титульный лист как корень, страницы и
       канвасы вперемешку — одно дерево, а не переключатель режимов. ---------- -->
  <aside class="editor-tree" id="editor-tree">
    <div class="editor-tree-header">
      <span class="text-sm" style="font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
        {{ project.name }}
      </span>
      <button class="btn btn-ghost btn-sm" id="btn-collapse-tree" title="⟨⟨">⟨⟨</button>
    </div>
    <div id="tree-root"></div>
  </aside>

  <!-- ---------- Рабочая область: markdown-страница или канвас — то,
       что сейчас открыто в дереве. JS сам решает, что отрисовать. ---------- -->
  <main class="editor-workspace" id="editor-workspace">
    <div class="editor-workspace-header">
      <div class="flex items-center gap-2">
        <button class="btn btn-ghost btn-sm" id="btn-expand-tree" style="display: none;" title="⟩⟩">⟩⟩</button>
        <span id="workspace-title" style="font-weight: 600; font-size: 14px;"></span>
      </div>
      <div class="flex items-center gap-2">
        <div class="presence-stack" id="presence-stack"></div>
        <button class="btn btn-ghost btn-sm" id="btn-open-settings" data-i18n="ui.settings.title"></button>
        <button class="btn btn-ghost btn-sm" id="btn-suggestions" data-i18n="ui.canvas.suggestions_title"></button>
      </div>
    </div>
    <div id="workspace-body" style="flex: 1; overflow: hidden; position: relative;"></div>
  </main>
</div>

<!-- ---------- Шаблоны содержимого рабочей области (клонируются в JS) ---------- -->
<template id="tpl-page-editor">
  <div class="page-editor">
    <div class="page-editor-source">
      <textarea id="page-source" spellcheck="false"></textarea>
    </div>
    <div class="page-editor-preview"><div class="md-body" id="page-preview"></div></div>
  </div>
</template>

<template id="tpl-canvas-editor">
  <div class="canvas-stage" id="canvas-stage">
    <svg id="svg-canvas">
      <g id="canvas-viewport">
        <g id="connectors-layer"></g>
        <g id="blocks-layer"></g>
        <g id="cursors-layer"></g>
      </g>
    </svg>
    <!-- Левый док инструментов -->
    <div class="tool-dock glass" id="tool-dock">
      <button class="tool-btn active" id="tool-select" title="Выбор">➤</button>
      <button class="tool-btn" id="tool-pan" title="Панорама">✋</button>
      <button class="tool-btn" id="tool-connect" title="Соединяйте блоки, потянув от точки на краю блока">╱</button>
      <button class="tool-btn" id="tool-shapes" title="Фигуры">▢</button>
      <button class="tool-btn" id="tool-delete" title="Удалить выбранный блок">🗑</button>
      <hr style="border:none;border-top:1px solid var(--line);margin:4px 2px;width:100%;">
      <button class="tool-btn" id="tool-zoom-in" title="Приблизить">＋</button>
      <button class="tool-btn" id="tool-zoom-out" title="Отдалить">－</button>
      <button class="tool-btn" id="tool-zoom-fit" title="Вписать всё">⛶</button>
    </div>

    <!-- Палитра фигур -->
    <div class="shape-menu glass" id="shape-menu">
      <button class="shape-item" data-shape="rectangle"><svg width="18" height="14"><rect x="1" y="1" width="16" height="12" fill="none" stroke="currentColor"/></svg><span data-i18n="ui.canvas.shape_rectangle"></span></button>
      <button class="shape-item" data-shape="rounded"><svg width="18" height="14"><rect x="1" y="1" width="16" height="12" rx="4" fill="none" stroke="currentColor"/></svg><span data-i18n="ui.canvas.shape_rounded"></span></button>
      <button class="shape-item" data-shape="ellipse"><svg width="18" height="14"><ellipse cx="9" cy="7" rx="8" ry="6" fill="none" stroke="currentColor"/></svg><span data-i18n="ui.canvas.shape_ellipse"></span></button>
      <button class="shape-item" data-shape="diamond"><svg width="18" height="14"><path d="M9 1 L17 7 L9 13 L1 7 Z" fill="none" stroke="currentColor"/></svg><span data-i18n="ui.canvas.shape_diamond"></span></button>
      <button class="shape-item" data-shape="hexagon"><svg width="18" height="14"><path d="M5 1 L13 1 L17 7 L13 13 L5 13 L1 7 Z" fill="none" stroke="currentColor"/></svg><span data-i18n="ui.canvas.shape_hexagon"></span></button>
      <button class="shape-item" data-shape="parallelogram"><svg width="18" height="14"><path d="M4 1 L17 1 L13 13 L0 13 Z" fill="none" stroke="currentColor"/></svg><span data-i18n="ui.canvas.shape_parallelogram"></span></button>
    </div>

    <div class="toolbar-float glass">
      <button class="btn btn-primary btn-sm" id="btn-add-block">
        <span>＋</span><span data-i18n="ui.canvas.add_block"></span>
      </button>
      <button class="btn btn-ghost btn-sm" id="btn-suggest-mode" data-i18n="ui.canvas.suggest_mode" style="display: none;"></button>
    </div>
  </div>
</template>

<!-- ---------- Панель проверки (список несвязанных блоков) ---------- -->
<div class="panel glass" id="validation-panel" style="position: absolute; top: 60px; right: 20px; width: 280px; max-height: 50vh; overflow-y: auto; padding: 12px; display: none; z-index: 20; box-shadow: var(--shadow-2);">
  <div id="validation-list"></div>
</div>

<!-- ---------- Панель предложений ---------- -->
<div class="panel glass" id="suggestions-panel" style="position: absolute; top: 60px; right: 20px; width: 320px; max-height: 70vh; overflow-y: auto; padding: 16px; display: none; z-index: 21; box-shadow: var(--shadow-2);">
  <div class="flex items-center justify-between" style="margin-bottom: 12px;">
    <h4 style="margin: 0;" data-i18n="ui.canvas.suggestions_title"></h4>
    <button class="btn btn-ghost btn-sm" id="btn-close-suggestions" data-i18n="ui.common.close"></button>
  </div>
  <button class="btn btn-primary btn-sm" id="btn-new-suggestion" style="width: 100%; margin-bottom: 12px;" data-i18n="ui.canvas.suggest_mode"></button>
  <div id="suggestions-list"></div>
</div>

<!-- ---------- Модалка "новое предложение" ---------- -->
<div id="suggestion-modal" class="modal-overlay" style="display: none;">
  <div class="panel" style="max-width: 420px; width: 100%; padding: 28px;">
    <h3 style="margin: 0 0 20px;" data-i18n="ui.canvas.suggest_mode"></h3>
    <label data-i18n="ui.canvas.suggestion_title_label"></label>
    <input type="text" id="suggestion-title" style="margin-bottom: 14px;">
    <label data-i18n="ui.canvas.suggestion_comment_label"></label>
    <textarea id="suggestion-comment" rows="3" style="margin-bottom: 20px; resize: vertical;"></textarea>
    <div class="flex gap-2 justify-between">
      <button class="btn btn-ghost" id="btn-cancel-suggestion" data-i18n="ui.project.new.cancel"></button>
      <button class="btn btn-primary" id="btn-submit-suggestion" data-i18n="ui.canvas.send_suggestion"></button>
    </div>
  </div>
</div>

<!-- ---------- Модалка настроек проекта (видимость/команда/ссылки) ---------- -->
<div id="settings-modal" class="modal-overlay" style="display: none;">
  <div class="panel" style="max-width: 480px; width: 100%; padding: 28px; max-height: 85vh; overflow-y: auto;">
    <div class="flex items-center justify-between" style="margin-bottom: 20px;">
      <h3 style="margin: 0;" data-i18n="ui.settings.title"></h3>
      <button class="btn btn-ghost btn-sm" id="btn-close-settings" data-i18n="ui.common.close"></button>
    </div>

    <div class="sidebar-section">
      <label data-i18n="ui.visibility.label"></label>
      <select id="visibility-select">
        <option value="private" data-i18n="ui.visibility.private"></option>
        <option value="link" data-i18n="ui.visibility.link"></option>
        <option value="public" data-i18n="ui.visibility.public"></option>
      </select>

      <div id="slug-edit-row" style="display: none; margin-top: 12px;">
        <label data-i18n="ui.settings.slug_label"></label>
        <div class="flex gap-2">
          <input type="text" id="slug-input" data-i18n-placeholder="ui.settings.slug_placeholder">
          <button class="btn btn-primary btn-sm" id="btn-save-slug" data-i18n="ui.settings.slug_save"></button>
        </div>
        <div id="slug-display" class="field-hint"></div>
        <div id="slug-status" class="slug-status"></div>
      </div>
    </div>

    <div class="sidebar-section">
      <h4 data-i18n="ui.settings.team_title"></h4>
      <div id="members-list"></div>
      <div class="flex gap-2" style="margin-top: 10px;">
        <input type="text" id="new-member-username" data-i18n-placeholder="ui.settings.add_member">
        <select id="new-member-role" style="max-width: 130px;">
          <option value="viewer" data-i18n="ui.settings.role_viewer"></option>
          <option value="editor" data-i18n="ui.settings.role_editor"></option>
        </select>
        <button class="btn btn-primary btn-sm" id="btn-add-member">＋</button>
      </div>
    </div>

  </div>
</div>

<!-- ---------- Модалка создания узла: название + карточки типа ---------- -->
<div id="create-node-modal" class="modal-overlay" style="display: none;">
  <div class="panel modal-card">
    <h3 data-i18n="ui.create.title"></h3>
    <label data-i18n="ui.create.name_label"></label>
    <input type="text" id="create-node-title" data-i18n-placeholder="ui.create.name_placeholder">
    <div class="node-type-grid">
      <div class="node-type-card selected" data-kind="page">
        <div class="nt-icon">📄</div>
        <div class="nt-title" data-i18n="ui.create.page"></div>
        <div class="nt-desc" data-i18n="ui.create.page_desc"></div>
      </div>
      <div class="node-type-card" data-kind="canvas">
        <div class="nt-icon">🧩</div>
        <div class="nt-title" data-i18n="ui.create.canvas"></div>
        <div class="nt-desc" data-i18n="ui.create.canvas_desc"></div>
      </div>
    </div>
    <div class="flex gap-2 justify-between">
      <button class="btn btn-ghost" id="btn-cancel-create-node" data-i18n="ui.common.close"></button>
      <button class="btn btn-primary" id="btn-submit-create-node" data-i18n="ui.create.submit"></button>
    </div>
  </div>
</div>

<!-- ---------- Контекстное меню правой кнопкой на узле дерева ---------- -->
<div id="tree-context-menu" class="panel glass" style="display: none; position: fixed; z-index: 200; padding: 6px; min-width: 180px;"></div>
{% endblock %}

{% block extra_head %}
<style>
  .sidebar-section { margin-bottom: 20px; }
  .sidebar-section h4 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-faint); margin: 0 0 10px; }
  .member-row, .link-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; font-size: 13px; }
  .context-menu-item { padding: 8px 12px; border-radius: var(--radius-sm); font-size: 13px; cursor: pointer; white-space: nowrap; }
  .context-menu-item:hover { background: var(--border-subtle); }
</style>
{% endblock %}

{% block extra_scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
  window.FF_PROJECT = {{ project.public_dict(current_user) | tojson }};
  window.FF_ROOT_NODE_ID = {{ root_node_id | tojson }};
  window.FF_OPEN_NODE_ID = {{ open_node_id | tojson }};
</script>
<script src="{{ url_for('static', filename='js/api-client.js') }}"></script>
<script src="{{ url_for('static', filename='js/wiki-links.js') }}"></script>
<script src="{{ url_for('static', filename='js/canvas-graph.js') }}"></script>
<script src="{{ url_for('static', filename='js/canvas-socket.js') }}"></script>
<script src="{{ url_for('static', filename='js/project-panel.js') }}"></script>
<script src="{{ url_for('static', filename='js/tree-nav.js') }}"></script>
<script src="{{ url_for('static', filename='js/canvas.js') }}"></script>
<script src="{{ url_for('static', filename='js/canvas-tools.js') }}"></script>
<script src="{{ url_for('static', filename='js/create-node.js') }}"></script>
<script src="{{ url_for('static', filename='js/editor.js') }}"></script>
{% endblock %}
