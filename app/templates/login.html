{% extends "base.html" %}
{% block title %}{{ translations["ui.login.title"] }} — FlowForge{% endblock %}

{% block content %}
<div style="display: flex; align-items: center; justify-content: center; min-height: 70vh; padding: 24px;">
  <div class="panel" style="max-width: 380px; width: 100%; padding: 40px 32px; text-align: center;">
    <div class="brand-mark" style="width: 52px; height: 52px; margin: 0 auto 20px; font-size: 22px;">◆</div>

    <h2 style="margin: 0 0 8px; font-size: 22px;" data-i18n="ui.login.title"></h2>
    <p class="text-secondary" style="margin: 0 0 28px; font-size: 14px; line-height: 1.5;" data-i18n="ui.login.subtitle"></p>

    {% if error %}
      <div class="validation-item error" style="text-align: left; margin-bottom: 20px;">
        {{ error }}
      </div>
    {% endif %}

    <a href="{{ url_for('auth.telegram_start') }}" class="telegram-btn" style="width: 100%; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M21.5 4.5L2.5 12l6 2m13-9.5l-3.5 16-9.5-7m13-9L8.5 14.5m0 0l-.5 5.5 3-3" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span data-i18n="ui.login.button"></span>
    </a>
  </div>
</div>
{% endblock %}
